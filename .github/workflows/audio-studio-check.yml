name: Audio Studio syntax checks
on:
  pull_request:
  push:
    branches: [feature/dialogue-audio-director]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python modules without importing ComfyUI
        run: |
          python -m py_compile Unwin-MiniMax-Director/dialogue_studio.py Unwin-MiniMax-Director/audio_pipeline.py Unwin-MiniMax-Director/__init__.py
      - name: Validate JSON templates
        run: |
          python -m json.tool Unwin-MiniMax-Director/t2v.json > /dev/null
          python -m json.tool Unwin-MiniMax-Director/i2v.json > /dev/null
